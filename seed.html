ta-de-hielo\\\", \\\"name\\\": \\\"Tormenta de Hielo\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"int\\\", \\\"attack_type\\\": \\\"save\\\", \\\"success_description\\\": \\\"El granizo golpea con fuerza a los enemigos en el \\\\u00e1rea.\\\", \\\"failure_description\\\": \\\"Los objetivos logran cubrirse y reciben solo la mitad del da\\\\u00f1o.\\\", \\\"is_scalable\\\": true, \\\"base_level\\\": 4, \\\"damage_dice\\\": \\\"2d8+4d6\\\", \\\"scaling_formula\\\": \\\"1d8\\\", \\\"lore_description\\\": \\\"Cae granizo en un cilindro de 20 pies de radio y 40 de altura. Cada criatura en el \\\\u00e1rea hace una salvaci\\\\u00f3n de Destreza: mitad de da\\\\u00f1o si tiene \\\\u00e9xito. El \\\\u00e1rea se convierte en terreno dif\\\\u00edcil hasta el final del siguiente turno de Kael.\\\", \\\"tactical_summary\\\": \\\"Salvaci\\\\u00f3n de Destreza (mitad), cilindro de 20 pies. 2d8 contundente + 4d6 fr\\\\u00edo; la parte contundente sube 1d8 por nivel de espacio superior a 4. Alcance 300 pies.\\\"}, {\\\"id\\\": \\\"ability-conjurar-elemental\\\", \\\"name\\\": \\\"Conjurar Elemental\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"int\\\", \\\"attack_type\\\": \\\"none\\\", \\\"success_description\\\": \\\"El elemental invocado obedece las \\\\u00f3rdenes de Kael.\\\", \\\"failure_description\\\": \\\"No aplica; el conjuro no requiere tirada enfrentada.\\\", \\\"is_scalable\\\": false, \\\"base_level\\\": 5, \\\"damage_dice\\\": \\\"\\\", \\\"scaling_formula\\\": \\\"\\\", \\\"lore_description\\\": \\\"Kael invoca a un elemental (aire, tierra, fuego o agua, VD 5 o menos) que act\\\\u00faa como aliado amistoso mientras Kael mantenga la concentraci\\\\u00f3n. Si Kael se desconcentra, el elemental se vuelve hostil. Lanzado con espacios superiores, el VD del elemental invocado aumenta. Tiempo de lanzamiento real: 1 minuto.\\\", \\\"tactical_summary\\\": \\\"Invocaci\\\\u00f3n de un aliado temporal, concentraci\\\\u00f3n 1 hora. Tiempo de lanzamiento 1 minuto, no apto para combate reactivo inmediato.\\\"}, {\\\"id\\\": \\\"ability-muro-de-fuerza\\\", \\\"name\\\": \\\"Muro de Fuerza\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"int\\\", \\\"attack_type\\\": \\\"none\\\", \\\"success_description\\\": \\\"El muro invisible bloquea por completo el paso.\\\", \\\"failure_description\\\": \\\"No aplica; el conjuro no requiere tirada enfrentada.\\\", \\\"is_scalable\\\": false, \\\"base_level\\\": 5, \\\"damage_dice\\\": \\\"\\\", \\\"scaling_formula\\\": \\\"\\\", \\\"lore_description\\\": \\\"Kael erige un muro de fuerza invisible e indestructible (salvo por Desintegrar), en forma de c\\\\u00fapula, esfera o hasta 10 paneles cuadrados. Bloquea el paso f\\\\u00edsico y el viaje et\\\\u00e9reo mientras dure la concentraci\\\\u00f3n.\\\", \\\"tactical_summary\\\": \\\"Control de \\\\u00e1rea/protecci\\\\u00f3n total. Concentraci\\\\u00f3n 10 minutos, alcance 120 pies. Ideal para bloquear pasillos o proteger a aliados.\\\"}, {\\\"id\\\": \\\"ability-transmigracion\\\", \\\"name\\\": \\\"Transmigraci\\\\u00f3n\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"int\\\", \\\"attack_type\\\": \\\"save\\\", \\\"success_description\\\": \\\"El alma de Kael se apodera del cuerpo objetivo.\\\", \\\"failure_description\\\": \\\"El objetivo resiste el intento de posesi\\\\u00f3n.\\\", \\\"is_scalable\\\": false, \\\"base_level\\\": 6, \\\"damage_dice\\\": \\\"\\\", \\\"scaling_formula\\\": \\\"\\\", \\\"lore_description\\\": \\\"El cuerpo de Kael queda catat\\\\u00f3nico mientras su alma entra en un recipiente ornamental de al menos 500 po. Desde all\\\\u00ed puede intentar poseer a un humanoide a 100 pies o menos: el objetivo hace una salvaci\\\\u00f3n de Carisma para resistir. Si Kael falla el intento sobre alguien, no puede reintentarlo con esa criatura hasta pasadas 24 horas. Tiempo de lanzamiento real: 1 minuto.\\\", \\\"tactical_summary\\\": \\\"Control/posesi\\\\u00f3n de alto riesgo, salvaci\\\\u00f3n de Carisma niega. Requiere recipiente material costoso; tiempo de lanzamiento 1 minuto.\\\"}, {\\\"id\\\": \\\"ability-espada-arcana\\\", \\\"name\\\": \\\"Espada Arcana\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"int\\\", \\\"attack_type\\\": \\\"attack\\\", \\\"success_description\\\": \\\"La espada de fuerza atraviesa al objetivo.\\\", \\\"failure_description\\\": \\\"La espada espectral falla su golpe.\\\", \\\"is_scalable\\\": false, \\\"base_level\\\": 7, \\\"damage_dice\\\": \\\"3d10\\\", \\\"scaling_formula\\\": \\\"\\\", \\\"lore_description\\\": \\\"Kael invoca una hoja de fuerza flotante que ataca cuerpo a cuerpo al aparecer. Mientras dure la concentraci\\\\u00f3n, puede usar una acci\\\\u00f3n adicional en cada turno para mover la espada hasta 20 pies y repetir el ataque contra el mismo objetivo u otro distinto.\\\", \\\"tactical_summary\\\": \\\"Ataque de conjuro cuerpo a cuerpo, 3d10 de fuerza. Concentraci\\\\u00f3n 1 minuto, reutilizable como acci\\\\u00f3n adicional en turnos siguientes.\\\"}], \\\"bonus_action\\\": [{\\\"id\\\": \\\"ability-paso-brumoso\\\", \\\"name\\\": \\\"Paso Brumoso\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"int\\\", \\\"attack_type\\\": \\\"none\\\", \\\"success_description\\\": \\\"Kael se disuelve en bruma plateada y reaparece en el lugar elegido.\\\", \\\"failure_description\\\": \\\"No aplica; el conjuro no puede fallar por s\\\\u00ed mismo.\\\", \\\"is_scalable\\\": false, \\\"base_level\\\": 2, \\\"damage_dice\\\": \\\"\\\", \\\"scaling_formula\\\": \\\"\\\", \\\"lore_description\\\": \\\"Rodeado brevemente de una bruma plateada, Kael se teletransporta hasta 30 pies a un espacio desocupado que pueda ver.\\\", \\\"tactical_summary\\\": \\\"Teletransporte de escape/reposicionamiento, acci\\\\u00f3n adicional, alcance personal 30 pies.\\\"}], \\\"reaction\\\": [], \\\"passive\\\": [{\\\"id\\\": \\\"ability-forma-cambiante\\\", \\\"name\\\": \\\"Forma Cambiante\\\", \\\"type\\\": \\\"racial_trait\\\", \\\"lore_description\\\": \\\"Kael puede usar su acci\\\\u00f3n para transformarse en zorro. Conserva sus estad\\\\u00edsticas salvo el tama\\\\u00f1o, y su equipo se funde con la nueva forma. Puede mantenerla tantas horas como su bonificador de Sabidur\\\\u00eda (m\\\\u00ednimo 1) antes de volver a su forma habitual, o revertir antes con una acci\\\\u00f3n adicional. Dispone de dos usos, recuperables tras un descanso corto o largo.\\\", \\\"tactical_summary\\\": \\\"2 usos por descanso (corto o largo). \\\\u00datil para sigilo, huida o exploraci\\\\u00f3n discreta.\\\", \\\"tactical_role\\\": \\\"Utilidad\\\"}, {\\\"id\\\": \\\"ability-astucia-arcana\\\", \\\"name\\\": \\\"Astucia Arcana\\\", \\\"type\\\": \\\"racial_trait\\\", \\\"lore_description\\\": \\\"Kael tiene ventaja en todas las tiradas de salvaci\\\\u00f3n de Inteligencia, Sabidur\\\\u00eda y Carisma contra efectos m\\\\u00e1gicos.\\\", \\\"tactical_summary\\\": \\\"Ventaja en salvaciones de Int/Sab/Car contra magia.\\\", \\\"tactical_role\\\": \\\"Defensivo\\\"}, {\\\"id\\\": \\\"ability-encuentro-mistico\\\", \\\"name\\\": \\\"Encuentro M\\\\u00edstico\\\", \\\"type\\\": \\\"racial_trait\\\", \\\"lore_description\\\": \\\"Cuando Kael hace una prueba de Sabidur\\\\u00eda (Perspicacia) a solas con su interlocutor, se considera competente y duplica su bonificador de competencia en la prueba.\\\", \\\"tactical_summary\\\": \\\"Duplica el bonificador de competencia en Perspicacia durante conversaciones a solas.\\\", \\\"tactical_role\\\": \\\"Utilidad\\\"}, {\\\"id\\\": \\\"ability-mordisco\\\", \\\"name\\\": \\\"Mordisco (solo en forma de zorro)\\\", \\\"type\\\": \\\"racial_trait\\\", \\\"lore_description\\\": \\\"En su forma de zorro, Kael posee un ataque natural de mordisco cuerpo a cuerpo (alcance 5 pies, 1d6 perforante), con el que se considera competente.\\\", \\\"tactical_summary\\\": \\\"Ataque natural en forma de zorro: 1d6 perforante.\\\", \\\"tactical_role\\\": \\\"Ofensivo\\\"}, {\\\"id\\\": \\\"ability-furtivo\\\", \\\"name\\\": \\\"Furtivo (solo en forma de zorro)\\\", \\\"type\\\": \\\"racial_trait\\\", \\\"lore_description\\\": \\\"En su forma de zorro, Kael se considera competente en Destreza (Sigilo) y duplica su bonificador de competencia en dichas pruebas.\\\", \\\"tactical_summary\\\": \\\"Duplica el bonificador de competencia en Sigilo mientras est\\\\u00e1 en forma de zorro.\\\", \\\"tactical_role\\\": \\\"Utilidad\\\"}, {\\\"id\\\": \\\"ability-olfato-y-oido-agudizados\\\", \\\"name\\\": \\\"Olfato y O\\\\u00eddo Agudizados (solo en forma de zorro)\\\", \\\"type\\\": \\\"racial_trait\\\", \\\"lore_description\\\": \\\"En su forma de zorro, Kael tiene ventaja en las pruebas de Sabidur\\\\u00eda (Percepci\\\\u00f3n) basadas en el olfato o el o\\\\u00eddo.\\\", \\\"tactical_summary\\\": \\\"Ventaja en Percepci\\\\u00f3n por olfato/o\\\\u00eddo en forma de zorro.\\\", \\\"tactical_role\\\": \\\"Utilidad\\\"}, {\\\"id\\\": \\\"ability-idiomas\\\", \\\"name\\\": \\\"Idiomas\\\", \\\"type\\\": \\\"racial_trait\\\", \\\"lore_description\\\": \\\"Kael puede hablar, leer y escribir com\\\\u00fan y gengo.\\\", \\\"tactical_summary\\\": \\\"Conocimiento de los idiomas Com\\\\u00fan y Gengo.\\\", \\\"tactical_role\\\": \\\"Utilidad\\\"}, {\\\"id\\\": \\\"ability-truco-potenciado\\\", \\\"name\\\": \\\"Truco Potenciado\\\", \\\"type\\\": \\\"class_feature\\\", \\\"lore_description\\\": \\\"El da\\\\u00f1o de los trucos de Kael afecta incluso a criaturas que superan la salvaci\\\\u00f3n contra su efecto: reciben la mitad del da\\\\u00f1o (si lo hay), aunque no sufren los efectos adicionales del truco.\\\", \\\"tactical_summary\\\": \\\"Sus trucos con salvaci\\\\u00f3n nunca fallan del todo: m\\\\u00ednimo mitad de da\\\\u00f1o incluso si el objetivo salva.\\\", \\\"tactical_role\\\": \\\"Ofensivo\\\"}, {\\\"id\\\": \\\"ability-canalizacion-forzada\\\", \\\"name\\\": \\\"Canalizaci\\\\u00f3n Forzada\\\", \\\"type\\\": \\\"class_feature\\\", \\\"lore_description\\\": \\\"Kael puede lanzar un conjuro de mago de nivel 1 a 5 que inflija da\\\\u00f1o y hacer que inflija el m\\\\u00e1ximo da\\\\u00f1o posible. La primera vez que lo use en el d\\\\u00eda no sufre penalizaci\\\\u00f3n, pero cada uso adicional antes de un descanso largo le inflige da\\\\u00f1o necr\\\\u00f3tico creciente (2d12 por nivel de conjuro la primera repetici\\\\u00f3n, aumentando 1d12 por cada uso extra), da\\\\u00f1o que ignora resistencia e inmunidad.\\\", \\\"tactical_summary\\\": \\\"Nova de da\\\\u00f1o m\\\\u00e1ximo en un conjuro de nivel 1-5 (ideal con Bola de fuego o Muro de fuego). Un uso gratuito por d\\\\u00eda; usos extra cuestan da\\\\u00f1o necr\\\\u00f3tico propio creciente.\\\", \\\"tactical_role\\\": \\\"Ofensivo\\\"}, {\\\"id\\\": \\\"ability-copiar-un-conjuro-en-el-libro\\\", \\\"name\\\": \\\"Copiar un Conjuro en el Libro\\\", \\\"type\\\": \\\"class_feature\\\", \\\"lore_description\\\": \\\"Cuando Kael encuentra un conjuro de mago de nivel 1 o superior que pueda preparar, puede a\\\\u00f1adirlo a su libro de conjuros invirtiendo 2 horas y 50 po por nivel del conjuro para descifrarlo y transcribirlo.\\\", \\\"tactical_summary\\\": \\\"Permite ampliar el repertorio de conjuros conocidos entre aventuras (2h y 50po por nivel de conjuro).\\\", \\\"tactical_role\\\": \\\"Utilidad\\\"}, {\\\"id\\\": \\\"ability-erudito-de-la-evocacion\\\", \\\"name\\\": \\\"Erudito de la Evocaci\\\\u00f3n\\\", \\\"type\\\": \\\"class_feature\\\", \\\"lore_description\\\": \\\"El coste en oro y tiempo que Kael debe invertir para copiar un conjuro de evocaci\\\\u00f3n en su libro de conjuros se reduce a la mitad.\\\", \\\"tactical_summary\\\": \\\"Copiar conjuros de evocaci\\\\u00f3n cuesta la mitad de tiempo y oro.\\\", \\\"tactical_role\\\": \\\"Utilidad\\\"}, {\\\"id\\\": \\\"ability-esculpir-conjuros\\\", \\\"name\\\": \\\"Esculpir Conjuros\\\", \\\"type\\\": \\\"class_feature\\\", \\\"lore_description\\\": \\\"Al lanzar un conjuro de evocaci\\\\u00f3n que afecte a otras criaturas que pueda ver, Kael puede elegir a un n\\\\u00famero de ellas igual a 1 + el nivel del conjuro para que superen autom\\\\u00e1ticamente la salvaci\\\\u00f3n y no reciban da\\\\u00f1o si normalmente lo reducir\\\\u00edan a la mitad.\\\", \\\"tactical_summary\\\": \\\"Protege autom\\\\u00e1ticamente a 1 + nivel del conjuro aliados de sus propios conjuros de evocaci\\\\u00f3n en \\\\u00e1rea.\\\", \\\"tactical_role\\\": \\\"Defensivo\\\"}, {\\\"id\\\": \\\"ability-evocacion-potenciada\\\", \\\"name\\\": \\\"Evocaci\\\\u00f3n Potenciada\\\", \\\"type\\\": \\\"class_feature\\\", \\\"lore_description\\\": \\\"Kael a\\\\u00f1ade su modificador de Inteligencia a una tirada de da\\\\u00f1o de cualquier conjuro de evocaci\\\\u00f3n que lance.\\\", \\\"tactical_summary\\\": \\\"Suma +5 de da\\\\u00f1o extra (mod. Inteligencia) a un conjuro de evocaci\\\\u00f3n por lanzamiento.\\\", \\\"tactical_role\\\": \\\"Ofensivo\\\"}, {\\\"id\\\": \\\"ability-lanzamiento-de-conjuros\\\", \\\"name\\\": \\\"Lanzamiento de Conjuros\\\", \\\"type\\\": \\\"class_feature\\\", \\\"lore_description\\\": \\\"Como mago, Kael dispone de un libro de conjuros arcanos y del m\\\\u00e9todo de preparaci\\\\u00f3n de conjuros propio de la clase.\\\", \\\"tactical_summary\\\": \\\"Rasgo base que habilita el lanzamiento de conjuros de mago mediante preparaci\\\\u00f3n diaria.\\\", \\\"tactical_role\\\": \\\"Utilidad\\\"}, {\\\"id\\\": \\\"ability-mejora-de-caracteristica\\\", \\\"name\\\": \\\"Mejora de Caracter\\\\u00edstica\\\", \\\"type\\\": \\\"class_feature\\\", \\\"lore_description\\\": \\\"En los niveles 4, 8, 12, 16 y 19, Kael puede aumentar una puntuaci\\\\u00f3n de caracter\\\\u00edstica en 2, o dos puntuaciones en 1 cada una (o adquirir una dote), sin superar el m\\\\u00e1ximo de 20.\\\", \\\"tactical_summary\\\": \\\"Mejoras de caracter\\\\u00edstica ya aplicadas a lo largo de su progresi\\\\u00f3n hasta nivel 14.\\\", \\\"tactical_role\\\": \\\"Utilidad\\\"}, {\\\"id\\\": \\\"ability-remplazar-el-libro\\\", \\\"name\\\": \\\"Remplazar el Libro\\\", \\\"type\\\": \\\"class_feature\\\", \\\"lore_description\\\": \\\"Kael puede copiar un conjuro de su propio libro de conjuros a otro libro (por ejemplo, una copia de seguridad) invirtiendo solo 1 hora y 10 po por nivel del conjuro copiado. Si pierde su libro, puede usar el mismo proceso para transcribir los conjuros que tuviera preparados en uno nuevo.\\\", \\\"tactical_summary\\\": \\\"Permite duplicar o restaurar su libro de conjuros de forma r\\\\u00e1pida y barata.\\\", \\\"tactical_role\\\": \\\"Utilidad\\\"}]}, \\\"lore_info\\\": {\\\"backstory\\\": \\\"Kael naci\\\\u00f3 en un bosque encantado, hijo de dos kitsune exiliados que viv\\\\u00edan ocultos en forma animal. Cuando era ni\\\\u00f1o, unos cazadores furtivos masacraron a sus padres ante sus ojos; su madre, moribunda, lo envolvi\\\\u00f3 en niebla m\\\\u00e1gica para salvarlo, y desde entonces jur\\\\u00f3 venganza. Tras a\\\\u00f1os sobreviviendo como ladr\\\\u00f3n, fue acogido como aprendiz por Tollias, un mago ca\\\\u00eddo en desgracia, y m\\\\u00e1s tarde ingres\\\\u00f3 en el Conclave de Ardynor, una escuela de evocaci\\\\u00f3n. All\\\\u00ed trab\\\\u00f3 una gran amistad con el elfo Calion y desarroll\\\\u00f3 una rivalidad mortal con Rhovan Thorne, hijo de uno de los cazadores que masacraron a su familia. Cuando Rhovan hizo desaparecer a Calion en un duelo, Kael lo mat\\\\u00f3 en un ataque de furia y fue expulsado y desterrado de la escuela. Desde entonces vive como mercenario, viajando en busca de pistas sobre el paradero de Calion, acompa\\\\u00f1ado por Nix, una compa\\\\u00f1era ca\\\\u00f3tica que le devolvi\\\\u00f3 la capacidad de re\\\\u00edr tras a\\\\u00f1os de dolor.\\\", \\\"personality_traits\\\": \\\"Guarda silencio sobre su pasado hasta que conf\\\\u00eda plenamente en alguien, y entonces se abre por completo. Encuentra maneras oscuramente c\\\\u00f3micas de aliviar la tensi\\\\u00f3n en los peores momentos.\\\", \\\"ideals\\\": \\\"Venganza y memoria. Los que hacen da\\\\u00f1o a los inocentes deben responder por ello, y los ca\\\\u00eddos no deben ser olvidados.\\\", \\\"bonds\\\": \\\"Nix es la \\\\u00fanica familia que le queda; el Diario de Calion es la \\\\u00fanica pista que tiene de que su amigo a\\\\u00fan podr\\\\u00eda estar vivo.\\\", \\\"flaws\\\": \\\"Su sed de venganza contra quienes se parecen a sus antiguos enemigos puede nublar su juicio y ponerlo, o a su grupo, en peligro innecesario.\\\"}}\", \"{\\\"basic_info\\\": {\\\"name\\\": \\\"Miralia\\\", \\\"race\\\": \\\"Drac\\\\u00f3nido\\\", \\\"characterClass\\\": \\\"Cl\\\\u00e9rigo 6\\\", \\\"hp_max\\\": 60, \\\"ac\\\": 12, \\\"speed\\\": 30, \\\"spell_save_dc\\\": 16}, \\\"purse\\\": {\\\"gold\\\": 0, \\\"silver\\\": 0, \\\"copper\\\": 0}, \\\"ai_tips\\\": \\\"Miralia es una cl\\\\u00e9riga de apoyo y control: su Sabidur\\\\u00eda (20) y su CD de conjuros (16) hacen que casi cualquier salvaci\\\\u00f3n enemiga sea dif\\\\u00edcil de superar. En combate conviene priorizar: 1) proteger al grupo con Bendecir o Faro de esperanza antes de que empiece la pelea, 2) usar Rayo gu\\\\u00eda o Llama sagrada a distancia para dar ventaja a los golpeadores del grupo, 3) reservar Canalizar Divinidad (Preservar la vida) para emergencias de curaci\\\\u00f3n masiva en vez de gastar conjuros de nivel. Su b\\\\u00e1culo Lumen Dei sirve como arma de \\\\u00faltimo recurso, pero su fuerza real est\\\\u00e1 en la magia. Fuera de combate, Restablecimiento menor y Revivificar la convierten en la red de seguridad del grupo contra enfermedades, venenos y muertes s\\\\u00fabitas, as\\\\u00ed que conviene llevar siempre encima el diamante necesario para Revivificar. Plegaria de curaci\\\\u00f3n y Glifo custodio no sirven en mitad de una pelea (tardan 10 minutos y 1 hora respectivamente), as\\\\u00ed que se preparan antes o despu\\\\u00e9s del combate, nunca durante.\\\", \\\"user_tactics\\\": \\\"\\\", \\\"adventure_notes\\\": \\\"\\\", \\\"resources\\\": [{\\\"name\\\": \\\"Canalizar Divinidad\\\", \\\"current\\\": 2, \\\"max\\\": 2}, {\\\"name\\\": \\\"Arma de aliento\\\", \\\"current\\\": 1, \\\"max\\\": 1}], \\\"inventory\\\": {\\\"weapons\\\": [{\\\"id\\\": \\\"weapon-lumen-dei\\\", \\\"name\\\": \\\"Lumen Dei \\\\u00a9JSI-M01\\\", \\\"attack_bonus\\\": 5, \\\"damage\\\": {\\\"base_dice\\\": \\\"1d6+2\\\", \\\"base_type\\\": \\\"contundente\\\"}, \\\"conditional_damage\\\": [{\\\"condition\\\": \\\"Ataque a dos manos\\\", \\\"damage_dice\\\": \\\"1d8+2\\\", \\\"damage_type\\\": \\\"contundente\\\"}], \\\"properties\\\": [\\\"Vers\\\\u00e1til\\\"], \\\"homebrew_effect\\\": \\\"Amplifica las curaciones que canalizas a trav\\\\u00e9s de \\\\u00e9l (+1d4). Tiene un compartimento secreto donde Jiseol guarda caramelos 'por si Miralia se pone triste'.\\\", \\\"magic_charges\\\": {\\\"has_charges\\\": false, \\\"max\\\": 0, \\\"current\\\": 0}, \\\"success_description\\\": \\\"El b\\\\u00e1culo golpea con un resplandor c\\\\u00e1lido, casi reconfortante.\\\", \\\"failure_description\\\": \\\"El golpe se queda corto y el b\\\\u00e1culo repica contra el suelo.\\\", \\\"lore_description\\\": \\\"Un b\\\\u00e1culo clerical construido con mithril blanco y madera sagrada, rematado por una gran amatista que act\\\\u00faa como foco divino. Fue un regalo de Jiseol, la artificiera del grupo, pensado tanto para el combate como para reconfortar a Miralia en los malos momentos.\\\", \\\"tactical_summary\\\": \\\"Tiras un d20 y sumas +5; le dices el resultado al m\\\\u00e1ster y \\\\u00e9l te dice si le has dado | Da\\\\u00f1o: 1d6+2 Contundente (1d8+2 a dos manos)\\\", \\\"is_unique\\\": true}], \\\"mundane_items\\\": []}, \\\"stats\\\": {\\\"str\\\": {\\\"name\\\": \\\"Fuerza\\\", \\\"value\\\": 15, \\\"mod\\\": 2, \\\"description\\\": \\\"Mide la potencia f\\\\u00edsica y capacidades deportivas\\\"}, \\\"dex\\\": {\\\"name\\\": \\\"Destreza\\\", \\\"value\\\": 14, \\\"mod\\\": 2, \\\"description\\\": \\\"Mide la agilidad y los reflejos\\\"}, \\\"con\\\": {\\\"name\\\": \\\"Constituci\\\\u00f3n\\\", \\\"value\\\": 17, \\\"mod\\\": 3, \\\"description\\\": \\\"Mide la resistencia y la salud\\\"}, \\\"int\\\": {\\\"name\\\": \\\"Inteligencia\\\", \\\"value\\\": 15, \\\"mod\\\": 2, \\\"description\\\": \\\"Mide el razonamiento y la memoria\\\"}, \\\"wis\\\": {\\\"name\\\": \\\"Sabidur\\\\u00eda\\\", \\\"value\\\": 20, \\\"mod\\\": 5, \\\"description\\\": \\\"Mide la perspicacia e intuici\\\\u00f3n\\\"}, \\\"cha\\\": {\\\"name\\\": \\\"Carisma\\\", \\\"value\\\": 19, \\\"mod\\\": 4, \\\"description\\\": \\\"Mide la fuerza de personalidad y la presencia\\\"}}, \\\"spell_slots\\\": [{\\\"level\\\": 1, \\\"max\\\": 4, \\\"current\\\": 4}, {\\\"level\\\": 2, \\\"max\\\": 3, \\\"current\\\": 3}, {\\\"level\\\": 3, \\\"max\\\": 3, \\\"current\\\": 3}], \\\"skills\\\": [{\\\"name\\\": \\\"Acrobacias\\\", \\\"related_stat\\\": \\\"dex\\\", \\\"modifier\\\": 2}, {\\\"name\\\": \\\"Arcanos\\\", \\\"related_stat\\\": \\\"int\\\", \\\"modifier\\\": 2}, {\\\"name\\\": \\\"Atletismo\\\", \\\"related_stat\\\": \\\"str\\\", \\\"modifier\\\": 2}, {\\\"name\\\": \\\"Enga\\\\u00f1ar\\\", \\\"related_stat\\\": \\\"cha\\\", \\\"modifier\\\": 4}, {\\\"name\\\": \\\"Historia\\\", \\\"related_stat\\\": \\\"int\\\", \\\"modifier\\\": 2}, {\\\"name\\\": \\\"Interpretaci\\\\u00f3n\\\", \\\"related_stat\\\": \\\"cha\\\", \\\"modifier\\\": 4}, {\\\"name\\\": \\\"Intimidar\\\", \\\"related_stat\\\": \\\"cha\\\", \\\"modifier\\\": 4}, {\\\"name\\\": \\\"Investigaci\\\\u00f3n\\\", \\\"related_stat\\\": \\\"int\\\", \\\"modifier\\\": 2}, {\\\"name\\\": \\\"Juego de Manos\\\", \\\"related_stat\\\": \\\"dex\\\", \\\"modifier\\\": 2}, {\\\"name\\\": \\\"Medicina\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"modifier\\\": 8}, {\\\"name\\\": \\\"Naturaleza\\\", \\\"related_stat\\\": \\\"int\\\", \\\"modifier\\\": 2}, {\\\"name\\\": \\\"Percepci\\\\u00f3n\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"modifier\\\": 5}, {\\\"name\\\": \\\"Perspicacia\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"modifier\\\": 8}, {\\\"name\\\": \\\"Persuasi\\\\u00f3n\\\", \\\"related_stat\\\": \\\"cha\\\", \\\"modifier\\\": 4}, {\\\"name\\\": \\\"Religi\\\\u00f3n\\\", \\\"related_stat\\\": \\\"int\\\", \\\"modifier\\\": 5}, {\\\"name\\\": \\\"Sigilo\\\", \\\"related_stat\\\": \\\"dex\\\", \\\"modifier\\\": 2}, {\\\"name\\\": \\\"Supervivencia\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"modifier\\\": 5}, {\\\"name\\\": \\\"Trato con Animales\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"modifier\\\": 5}], \\\"abilities_by_action\\\": {\\\"action\\\": [{\\\"id\\\": \\\"ability-llama-sagrada\\\", \\\"name\\\": \\\"Llama sagrada\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"save\\\", \\\"success_description\\\": \\\"El enemigo esquiva el destello de fuego sagrado en el \\\\u00faltimo momento.\\\", \\\"failure_description\\\": \\\"Un destello de fuego divino cae sobre el enemigo, quem\\\\u00e1ndolo por dentro.\\\", \\\"is_scalable\\\": false, \\\"base_level\\\": 0, \\\"damage_dice\\\": \\\"2d8\\\", \\\"scaling_formula\\\": \\\"\\\", \\\"lore_description\\\": \\\"Un destello de fuego sagrado desciende sobre un enemigo a distancia. No hace falta apuntar con precisi\\\\u00f3n: ni escudos ni coberturas le sirven al objetivo para librarse del golpe de luz.\\\", \\\"tactical_summary\\\": \\\"El enemigo tira un d20; si supera tu CD (16), no recibe da\\\\u00f1o. Si no la supera, recibe todo el da\\\\u00f1o sin poder cubrirse | Da\\\\u00f1o: 2d8 Radiante\\\"}, {\\\"id\\\": \\\"ability-luz\\\", \\\"name\\\": \\\"Luz\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"none\\\", \\\"success_description\\\": \\\"El objeto empieza a brillar con una luz c\\\\u00e1lida y constante.\\\", \\\"failure_description\\\": \\\"\\\", \\\"is_scalable\\\": false, \\\"base_level\\\": 0, \\\"damage_dice\\\": \\\"\\\", \\\"scaling_formula\\\": \\\"\\\", \\\"lore_description\\\": \\\"Haces que un objeto peque\\\\u00f1o (una piedra, tu b\\\\u00e1culo, una moneda) emita luz del color que quieras durante una hora, iluminando una zona amplia a tu alrededor. \\\\u00datil para explorar cuevas oscuras o marcar un camino sin gastar antorchas.\\\", \\\"tactical_summary\\\": \\\"No tienes que tirar nada, tocas un objeto peque\\\\u00f1o y este empieza a brillar solo. Si intentas iluminar algo que lleva encima un enemigo, este puede tirar un d20 contra tu CD (16) para evitarlo.\\\"}, {\\\"id\\\": \\\"ability-orientacion-divina\\\", \\\"name\\\": \\\"Orientaci\\\\u00f3n divina\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"none\\\", \\\"success_description\\\": \\\"El aliado siente una peque\\\\u00f1a chispa de intuici\\\\u00f3n divina.\\\", \\\"failure_description\\\": \\\"\\\", \\\"is_scalable\\\": false, \\\"base_level\\\": 0, \\\"damage_dice\\\": \\\"\\\", \\\"scaling_formula\\\": \\\"\\\", \\\"lore_description\\\": \\\"Concedes una peque\\\\u00f1a chispa de intuici\\\\u00f3n divina a un aliado voluntario, que puede usarla una vez para mejorar cualquier prueba de habilidad importante, como forzar una cerradura o recordar un dato clave.\\\", \\\"tactical_summary\\\": \\\"No tienes que tirar nada: tocas a un aliado y, antes de que pase un minuto, esa persona puede tirar 1d4 extra para sumarlo a cualquier prueba de habilidad que haga.\\\"}, {\\\"id\\\": \\\"ability-resistencia\\\", \\\"name\\\": \\\"Resistencia\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"none\\\", \\\"success_description\\\": \\\"El aliado siente una capa invisible de protecci\\\\u00f3n divina.\\\", \\\"failure_description\\\": \\\"\\\", \\\"is_scalable\\\": false, \\\"base_level\\\": 0, \\\"damage_dice\\\": \\\"\\\", \\\"scaling_formula\\\": \\\"\\\", \\\"lore_description\\\": \\\"Bendices a un compa\\\\u00f1ero con protecci\\\\u00f3n divina temporal, d\\\\u00e1ndole la posibilidad de sumar un dado extra la pr\\\\u00f3xima vez que tenga que resistir un peligro, veneno o efecto m\\\\u00e1gico.\\\", \\\"tactical_summary\\\": \\\"No tienes que tirar nada: tocas a un aliado y, antes de que pase un minuto, esa persona puede tirar 1d4 extra para sumarlo a una tirada de salvaci\\\\u00f3n.\\\"}, {\\\"id\\\": \\\"ability-agarre-quitinoso\\\", \\\"name\\\": \\\"Agarre quitinoso\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"attack\\\", \\\"success_description\\\": \\\"Tus manos se convierten en mand\\\\u00edbulas quitinosas y atrapan al enemigo.\\\", \\\"failure_description\\\": \\\"El enemigo esquiva tus mand\\\\u00edbulas improvisadas.\\\", \\\"is_scalable\\\": true, \\\"base_level\\\": 1, \\\"damage_dice\\\": \\\"1d4\\\", \\\"scaling_formula\\\": \\\"1d4\\\", \\\"lore_description\\\": \\\"Tus manos se transforman en mand\\\\u00edbulas de insecto gigante para atrapar a un enemigo de tu tama\\\\u00f1o o menor. Mientras lo sujetes no podr\\\\u00e1s hacer nada m\\\\u00e1s con los brazos, y el enemigo puede intentar liberarse en su turno con una prueba de Fuerza o Destreza.\\\", \\\"tactical_summary\\\": \\\"Tiras un d20 y sumas +8; le dices el resultado al m\\\\u00e1ster y \\\\u00e9l te dice si has agarrado al enemigo. Mientras dure el agarre, recibe el mismo da\\\\u00f1o cada vez que empiece su turno atrapado | Da\\\\u00f1o: 1d4 Perforante\\\"}, {\\\"id\\\": \\\"ability-bendecir\\\", \\\"name\\\": \\\"Bendecir\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"none\\\", \\\"success_description\\\": \\\"Tus aliados sienten la gu\\\\u00eda divina reforzando cada uno de sus movimientos.\\\", \\\"failure_description\\\": \\\"\\\", \\\"is_scalable\\\": false, \\\"base_level\\\": 1, \\\"damage_dice\\\": \\\"\\\", \\\"scaling_formula\\\": \\\"\\\", \\\"lore_description\\\": \\\"Imbuyes a tus aliados con una gu\\\\u00eda divina que los ayuda tanto a golpear como a resistir peligros. Ideal para lanzarlo justo antes de que empiece una pelea importante. Es un conjuro de dominio, as\\\\u00ed que lo tienes siempre disponible sin gastar hueco de preparaci\\\\u00f3n.\\\", \\\"tactical_summary\\\": \\\"No tienes que tirar nada: eliges hasta tres aliados, y cada uno de ellos podr\\\\u00e1 sumar 1d4 extra la pr\\\\u00f3xima vez que ataque o resista algo, mientras dure el conjuro (hasta un minuto).\\\"}, {\\\"id\\\": \\\"ability-curar-heridas\\\", \\\"name\\\": \\\"Curar heridas\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"none\\\", \\\"success_description\\\": \\\"Una luz c\\\\u00e1lida cierra las heridas del objetivo al instante.\\\", \\\"failure_description\\\": \\\"\\\", \\\"is_scalable\\\": true, \\\"base_level\\\": 1, \\\"damage_dice\\\": \\\"1d8\\\", \\\"scaling_formula\\\": \\\"1d8\\\", \\\"lore_description\\\": \\\"Pones la mano sobre un aliado herido y la energ\\\\u00eda positiva de tu diosa cierra sus heridas al instante. Gracias a tu don de Disc\\\\u00edpula de la Vida, el aliado recupera 2 puntos extra por el nivel del conjuro usado, y t\\\\u00fa misma recuperas otros 2 gracias a tu don de Sanadora Bendecida. Es un conjuro de dominio, siempre disponible.\\\", \\\"tactical_summary\\\": \\\"No tienes que tirar nada, el objetivo se cura al tocarlo | Curaci\\\\u00f3n: 1d8 + Mod\\\"}, {\\\"id\\\": \\\"ability-infligir-heridas\\\", \\\"name\\\": \\\"Infligir heridas\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"attack\\\", \\\"success_description\\\": \\\"Tu mano se llena de energ\\\\u00eda oscura y golpea con fuerza devastadora.\\\", \\\"failure_description\\\": \\\"El golpe oscuro pasa de largo.\\\", \\\"is_scalable\\\": true, \\\"base_level\\\": 1, \\\"damage_dice\\\": \\\"3d10\\\", \\\"scaling_formula\\\": \\\"1d10\\\", \\\"lore_description\\\": \\\"Tu mano se llena de energ\\\\u00eda oscura y, si tocas al enemigo, este sufre un da\\\\u00f1o devastador. Es tu opci\\\\u00f3n m\\\\u00e1s agresiva cuerpo a cuerpo, pensada para rematar a un objetivo concreto.\\\", \\\"tactical_summary\\\": \\\"Tiras un d20 y sumas +8; le dices el resultado al m\\\\u00e1ster y \\\\u00e9l te dice si le has dado | Da\\\\u00f1o: 3d10 Necr\\\\u00f3tico\\\"}, {\\\"id\\\": \\\"ability-rayo-guia\\\", \\\"name\\\": \\\"Rayo gu\\\\u00eda\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"attack\\\", \\\"success_description\\\": \\\"El haz de luz marca al enemigo, dej\\\\u00e1ndolo brillando d\\\\u00e9bilmente.\\\", \\\"failure_description\\\": \\\"El haz de luz pasa de largo.\\\", \\\"is_scalable\\\": true, \\\"base_level\\\": 1, \\\"damage_dice\\\": \\\"4d6\\\", \\\"scaling_formula\\\": \\\"1d6\\\", \\\"lore_description\\\": \\\"Lanzas un haz de luz que marca al enemigo, dej\\\\u00e1ndolo brillando d\\\\u00e9bilmente y facilitando que tus aliados lo golpeen justo despu\\\\u00e9s.\\\", \\\"tactical_summary\\\": \\\"Tiras un d20 y sumas +8; le dices el resultado al m\\\\u00e1ster y \\\\u00e9l te dice si le has dado. Si aciertas, el pr\\\\u00f3ximo compa\\\\u00f1ero que ataque a ese enemigo antes de tu siguiente turno tira dos d20 y se queda con el mejor resultado | Da\\\\u00f1o: 4d6 Radiante\\\"}, {\\\"id\\\": \\\"ability-calmar-emociones\\\", \\\"name\\\": \\\"Calmar emociones\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"save\\\", \\\"success_description\\\": \\\"Los presentes sienten c\\\\u00f3mo sus emociones se apaciguan de golpe.\\\", \\\"failure_description\\\": \\\"Los presentes mantienen sus emociones intactas.\\\", \\\"is_scalable\\\": false, \\\"base_level\\\": 2, \\\"damage_dice\\\": \\\"\\\", \\\"scaling_formula\\\": \\\"\\\", \\\"lore_description\\\": \\\"Calmas los \\\\u00e1nimos de un grupo de gente, apagando emociones descontroladas. Muy \\\\u00fatil para frenar una pelea antes de que vaya a mayores, o para que un enemigo furioso deje de atacaros un rato.\\\", \\\"tactical_summary\\\": \\\"Todos los humanoides en una zona de 6 metros de radio donde t\\\\u00fa decidas tiran un d20 cada uno; si no superan tu CD (16), puedes elegir: quitarles el miedo o el hechizo que sufran, o hacer que dejen de ser hostiles hacia quien t\\\\u00fa digas.\\\"}, {\\\"id\\\": \\\"ability-inmovilizar-persona\\\", \\\"name\\\": \\\"Inmovilizar persona\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"save\\\", \\\"success_description\\\": \\\"El humanoide queda completamente paralizado.\\\", \\\"failure_description\\\": \\\"El humanoide resiste el efecto paralizante.\\\", \\\"is_scalable\\\": false, \\\"base_level\\\": 2, \\\"damage_dice\\\": \\\"\\\", \\\"scaling_formula\\\": \\\"\\\", \\\"lore_description\\\": \\\"Paralizas a un humanoide con energ\\\\u00eda m\\\\u00e1gica, dej\\\\u00e1ndolo indefenso mientras el efecto dure. Usando un espacio de conjuro m\\\\u00e1s alto puedes paralizar a varios humanoides a la vez, siempre que est\\\\u00e9n cerca entre ellos (a 9 metros o menos).\\\", \\\"tactical_summary\\\": \\\"El enemigo humanoide tira un d20; si no supera tu CD (16), queda paralizado y no puede moverse ni actuar. Al final de cada uno de sus turnos puede volver a tirar para intentar liberarse.\\\"}, {\\\"id\\\": \\\"ability-restablecimiento-menor\\\", \\\"name\\\": \\\"Restablecimiento menor\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"none\\\", \\\"success_description\\\": \\\"La enfermedad o condici\\\\u00f3n desaparece al instante.\\\", \\\"failure_description\\\": \\\"\\\", \\\"is_scalable\\\": false, \\\"base_level\\\": 2, \\\"damage_dice\\\": \\\"\\\", \\\"scaling_formula\\\": \\\"\\\", \\\"lore_description\\\": \\\"Con un simple toque, curas dolencias que ni una poci\\\\u00f3n normal soluciona: quitas enfermedades, venenos persistentes o condiciones que dejan a un aliado inutilizado en combate (ceguera, sordera, par\\\\u00e1lisis...). Es un conjuro de dominio, siempre disponible.\\\", \\\"tactical_summary\\\": \\\"No tienes que tirar nada: tocas al objetivo y autom\\\\u00e1ticamente se le quita una enfermedad o una condici\\\\u00f3n como ceguera, sordera, par\\\\u00e1lisis o envenenamiento.\\\"}, {\\\"id\\\": \\\"ability-espiritus-guardianes\\\", \\\"name\\\": \\\"Esp\\\\u00edritus guardianes\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"save\\\", \\\"success_description\\\": \\\"Los esp\\\\u00edritus golpean con fuerza a quien se acerca demasiado.\\\", \\\"failure_description\\\": \\\"El enemigo logra esquivar a los esp\\\\u00edritus.\\\", \\\"is_scalable\\\": true, \\\"base_level\\\": 3, \\\"damage_dice\\\": \\\"3d8\\\", \\\"scaling_formula\\\": \\\"1d8\\\", \\\"lore_description\\\": \\\"Convocas esp\\\\u00edritus protectores (angelicales, dada tu naturaleza bondadosa) que flotan a tu alrededor durante varios minutos, da\\\\u00f1ando y ralentizando a cualquier enemigo que se acerque demasiado a ti.\\\", \\\"tactical_summary\\\": \\\"Cualquier enemigo que entre o empiece su turno cerca de ti (radio de 4,5 metros) tira un d20; si no supera tu CD (16) recibe todo el da\\\\u00f1o, y si la supera recibe la mitad. Su velocidad tambi\\\\u00e9n se reduce a la mitad mientras est\\\\u00e9 ah\\\\u00ed | Da\\\\u00f1o: 3d8 Radiante\\\"}, {\\\"id\\\": \\\"ability-faro-de-esperanza\\\", \\\"name\\\": \\\"Faro de esperanza\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"none\\\", \\\"success_description\\\": \\\"Tus aliados sienten una calidez protectora que los llena de esperanza.\\\", \\\"failure_description\\\": \\\"\\\", \\\"is_scalable\\\": false, \\\"base_level\\\": 3, \\\"damage_dice\\\": \\\"\\\", \\\"scaling_formula\\\": \\\"\\\", \\\"lore_description\\\": \\\"Rodeas a tus aliados de una energ\\\\u00eda protectora que los mantiene con esperanza incluso en los momentos m\\\\u00e1s duros, asegurando que cualquier curaci\\\\u00f3n que reciban sea lo m\\\\u00e1s efectiva posible. Es un conjuro de dominio, siempre disponible.\\\", \\\"tactical_summary\\\": \\\"No tienes que tirar nada: eliges a cualquier n\\\\u00famero de aliados dentro del alcance. Mientras dure el conjuro, cada vez que se curen recuperan el m\\\\u00e1ximo posible, y tienen m\\\\u00e1s facilidad para resistir efectos de Sabidur\\\\u00eda o para no morir cuando est\\\\u00e1n agonizando.\\\"}, {\\\"id\\\": \\\"ability-plegaria-de-curacion\\\", \\\"name\\\": \\\"Plegaria de curaci\\\\u00f3n\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"none\\\", \\\"success_description\\\": \\\"El grupo entero recupera fuerzas tras la larga plegaria.\\\", \\\"failure_description\\\": \\\"\\\", \\\"is_scalable\\\": true, \\\"base_level\\\": 2, \\\"damage_dice\\\": \\\"2d8\\\", \\\"scaling_formula\\\": \\\"1d8\\\", \\\"lore_description\\\": \\\"OJO: es una plegaria larga y calmada (tarda 10 minutos), no algo que puedas usar en pleno combate. Perfecta para lanzarla justo despu\\\\u00e9s de una pelea o durante un descanso corto, para que todo el grupo llegue a la siguiente pelea con m\\\\u00e1s salud.\\\", \\\"tactical_summary\\\": \\\"No se lanza en combate, necesitas 10 minutos tranquilos. No tienes que tirar nada: hasta seis aliados que puedas ver recuperan puntos de golpe | Curaci\\\\u00f3n: 2d8 + Mod\\\"}, {\\\"id\\\": \\\"ability-revivificar\\\", \\\"name\\\": \\\"Revivificar\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"none\\\", \\\"success_description\\\": \\\"El compa\\\\u00f1ero ca\\\\u00eddo respira de nuevo.\\\", \\\"failure_description\\\": \\\"\\\", \\\"is_scalable\\\": false, \\\"base_level\\\": 3, \\\"damage_dice\\\": \\\"\\\", \\\"scaling_formula\\\": \\\"\\\", \\\"lore_description\\\": \\\"Tu conjuro de emergencia contra la muerte: si un compa\\\\u00f1ero acaba de caer (hace como mucho un minuto), puedes traerlo de vuelta antes de que sea demasiado tarde, aunque no cura las heridas que ya ten\\\\u00eda ni evita secuelas por haber estado muerto varias veces. Consume un diamante de al menos 300 monedas de oro, que desaparece al lanzarlo. Es un conjuro de dominio, siempre disponible.\\\", \\\"tactical_summary\\\": \\\"No tienes que tirar nada: tocas a una criatura muerta hace como mucho un minuto y esta vuelve a la vida con 1 punto de golpe.\\\"}, {\\\"id\\\": \\\"ability-glifo-custodio\\\", \\\"name\\\": \\\"Glifo custodio\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"save\\\", \\\"success_description\\\": \\\"El glifo estalla justo cuando el intruso lo activa.\\\", \\\"failure_description\\\": \\\"El intruso logra esquivar la explosi\\\\u00f3n m\\\\u00e1gica.\\\", \\\"is_scalable\\\": true, \\\"base_level\\\": 3, \\\"damage_dice\\\": \\\"5d8\\\", \\\"scaling_formula\\\": \\\"1d8\\\", \\\"lore_description\\\": \\\"OJO: no es un conjuro de combate, tardas 1 hora en prepararlo con calma. Inscribes una trampa m\\\\u00e1gica invisible sobre una puerta, un cofre o el suelo, que solo se activa bajo las condiciones que t\\\\u00fa decidas (pisarlo, tocarlo, abrir el objeto...). Ideal para proteger un campamento por la noche o resguardar un tesoro importante.\\\", \\\"tactical_summary\\\": \\\"No se lanza en combate, necesitas 1 hora tranquila para inscribirlo. Una vez activado, cualquiera que est\\\\u00e9 cerca tira un d20; si no supera tu CD (16) recibe todo el da\\\\u00f1o, y si la supera recibe la mitad | Da\\\\u00f1o: 5d8 (eliges el tipo: \\\\u00e1cido, fr\\\\u00edo, fuego, rayo o trueno)\\\"}, {\\\"id\\\": \\\"ability-arma-de-aliento\\\", \\\"name\\\": \\\"Arma de aliento\\\", \\\"type\\\": \\\"class_feature\\\", \\\"related_stat\\\": \\\"con\\\", \\\"attack_type\\\": \\\"save\\\", \\\"success_description\\\": \\\"El chorro de \\\\u00e1cido corrosivo ba\\\\u00f1a a los enemigos en la l\\\\u00ednea.\\\", \\\"failure_description\\\": \\\"Los enemigos logran esquivar la mayor parte del chorro \\\\u00e1cido.\\\", \\\"is_scalable\\\": false, \\\"base_level\\\": 0, \\\"damage_dice\\\": \\\"3d6\\\", \\\"scaling_formula\\\": \\\"\\\", \\\"lore_description\\\": \\\"Exhalas un chorro de \\\\u00e1cido corrosivo, herencia de tu sangre drac\\\\u00f3nica. Solo puedes usarlo una vez hasta que descanses, as\\\\u00ed que res\\\\u00e9rvalo para el momento en que de verdad haga falta un golpe de \\\\u00e1rea.\\\", \\\"tactical_summary\\\": \\\"Eliges una l\\\\u00ednea de 9 metros de largo. Todos los que est\\\\u00e9n dentro tiran un d20; si no superan tu CD (14) reciben todo el da\\\\u00f1o, y si la superan reciben la mitad | Da\\\\u00f1o: 3d6 \\\\u00c1cido\\\"}, {\\\"id\\\": \\\"ability-expulsar-muertos-vivientes\\\", \\\"name\\\": \\\"Expulsar muertos vivientes\\\", \\\"type\\\": \\\"class_feature\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"save\\\", \\\"success_description\\\": \\\"Los no-muertos huyen despavoridos (o, si son d\\\\u00e9biles, se desintegran).\\\", \\\"failure_description\\\": \\\"Los no-muertos resisten tu invocaci\\\\u00f3n divina.\\\", \\\"is_scalable\\\": false, \\\"base_level\\\": 0, \\\"damage_dice\\\": \\\"\\\", \\\"scaling_formula\\\": \\\"\\\", \\\"lore_description\\\": \\\"Usas una de tus dos cargas diarias de Canalizar Divinidad para ahuyentar (o directamente destruir) a los no-muertos d\\\\u00e9biles que te rodean. Es tu mejor baza contra zombis, esqueletos y cosas similares.\\\", \\\"tactical_summary\\\": \\\"Presentas tu s\\\\u00edmbolo sagrado y todos los muertos vivientes que te vean u oigan en un radio de 9 metros tiran un d20; si no superan tu CD (16), pasan un minuto entero intentando alejarse de ti. Si adem\\\\u00e1s son muy d\\\\u00e9biles (VD 1/2 o menos), quedan destruidos directamente.\\\"}, {\\\"id\\\": \\\"ability-canalizar-preservar-la-vida\\\", \\\"name\\\": \\\"Canalizar: preservar la vida\\\", \\\"type\\\": \\\"class_feature\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"none\\\", \\\"success_description\\\": \\\"Un torrente de energ\\\\u00eda positiva cierra las heridas de tus aliados.\\\", \\\"failure_description\\\": \\\"\\\", \\\"is_scalable\\\": false, \\\"base_level\\\": 0, \\\"damage_dice\\\": \\\"+30\\\", \\\"scaling_formula\\\": \\\"\\\", \\\"lore_description\\\": \\\"Tu segunda opci\\\\u00f3n de Canalizar Divinidad: en vez de asustar enemigos, usas esa misma energ\\\\u00eda para repartir una curaci\\\\u00f3n de emergencia entre tus aliados heridos, sin necesidad de lanzar ning\\\\u00fan conjuro. No funciona con no-muertos ni constructos, y ninguna criatura puede recuperar m\\\\u00e1s de la mitad de su vida m\\\\u00e1xima con este efecto.\\\", \\\"tactical_summary\\\": \\\"No tienes que tirar nada: sacas tu s\\\\u00edmbolo sagrado y repartes 30 puntos de golpe de curaci\\\\u00f3n entre las criaturas que quieras dentro de un radio de 9 metros | Curaci\\\\u00f3n: +30 (repartidos)\\\"}], \\\"bonus_action\\\": [{\\\"id\\\": \\\"ability-arma-espiritual\\\", \\\"name\\\": \\\"Arma espiritual\\\", \\\"type\\\": \\\"spell\\\", \\\"related_stat\\\": \\\"wis\\\", \\\"attack_type\\\": \\\"attack\\\", \\\"success_description\\\": \\\"El arma espectral golpea con fuerza divina.\\\", \\\"failure_description\\\": \\\"El arma espectral falla el golpe.\\\", \\\"is_scalable\\\": true, \\\"base_level\\\": 2, \\\"damage_dice\\\": \\\"1d8\\\", \\\"scaling_formula\\\": \\\"1d8\\\", \\\"lore_description\\\": \\\"Creas un arma fantasmal con la forma del s\\\\u00edmbolo de tu diosa (probablemente un b\\\\u00e1culo de luz) que flota cerca de ti durante un minuto. Solo sube de da\\\\u00f1o cada dos niveles de espacio por encima del segundo. Es un conjuro de dominio, siempre disponible.\\\", \\\"tactical_summary\\\": \\\"Como acci\\\\u00f3n adicional en tus pr\\\\u00f3ximos turnos puedes mover el arma y hacer que ataque: tiras un d20 y sumas +8; le dices el resultado al m\\\\u00e1ster y \\\\u00e9l te dice si le has dado | Da\\\\u00f1o: 1d8 + Mod de Sabidur\\\\u00eda\\\"}], \\\"reaction\\\": [], \\\"passive\\\": [{\\\"id\\\": \\\"ability-resistencia-al-dano\\\", \\\"name\\\": \\\"Resistencia al da\\\\u00f1o\\\", \\\"type\\\": \\\"trait\\\", \\\"lore_description\\\": \\\"Tu sangre drac\\\\u00f3nica de linaje negro te protege del \\\\u00e1cido, el mismo tipo de da\\\\u00f1o que t\\\\u00fa misma puedes exhalar.\\\", \\\"tactical_summary\\\": \\\"Cualquier da\\\\u00f1o de tipo \\\\u00c1cido que recibas se reduce a la mitad autom\\\\u00e1ticamente.\\\", \\\"tactical_role\\\": \\\"Defensivo\\\"}, {\\\"id\\\": \\\"ability-destruir-muertos-vivientes\\\", \\\"name\\\": \\\"Destruir muertos vivientes\\\", \\\"type\\\": \\\"class_feature\\\", \\\"lore_description\\\": \\\"Cuando expulsas a los no-muertos, los m\\\\u00e1s d\\\\u00e9biles no solo huyen de ti: se desintegran directamente.\\\", \\\"tactical_summary\\\": \\\"Si un muerto viviente falla la tirada contra tu Expulsar muertos vivientes y su nivel de peligro es 1/2 o menor, queda destruido al instante en vez de solo huir.\\\", \\\"tactical_role\\\": \\\"Ofensivo\\\"}, {\\\"id\\\": \\\"ability-discipulo-de-la-vida\\\", \\\"name\\\": \\\"Disc\\\\u00edpulo de la vida\\\", \\\"type\\\": \\\"class_feature\\\", \\\"lore_description\\\": \\\"Tu conexi\\\\u00f3n con la energ\\\\u00eda vital hace que tus curaciones lleguen m\\\\u00e1s lejos que las de cualquier otro cl\\\\u00e9rigo, y adem\\\\u00e1s te permite llevar armaduras pesadas sin problema.\\\", \\\"tactical_summary\\\": \\\"Cada vez que un conjuro de nivel 1 o superior haga que alguien recupere puntos de golpe, esa persona recupera 2 puntos extra m\\\\u00e1s el nivel del conjuro usado. Tambi\\\\u00e9n tienes competencia con armadura pesada.\\\", \\\"tactical_role\\\": \\\"Defensivo\\\"}, {\\\"id\\\": \\\"ability-sanador-bendecido\\\", \\\"name\\\": \\\"Sanador bendecido\\\", \\\"type\\\": \\\"class_feature\\\", \\\"lore_description\\\": \\\"La energ\\\\u00eda positiva que usas para sanar a otros tambi\\\\u00e9n te roza a ti, dej\\\\u00e1ndote un poco de vitalidad de vuelta.\\\", \\\"tactical_summary\\\": \\\"Cada vez que cures a otra criatura con un conjuro de nivel 1 o superior, t\\\\u00fa tambi\\\\u00e9n recuperas 2 puntos de golpe m\\\\u00e1s el nivel del conjuro usado.\\\", \\\"tactical_role\\\": \\\"Defensivo\\\"}, {\\\"id\\\": \\\"ability-lanzamiento-de-conjuros\\\", \\\"name\\\": \\\"Lanzamiento de conjuros\\\", \\\"type\\\": \\\"class_feature\\\", \\\"lore_description\\\": \\\"Eres capaz de canalizar el poder divino de tu diosa en forma de conjuros de cl\\\\u00e9riga, preparando cada d\\\\u00eda los que necesites de tu lista.\\\", \\\"tactical_summary\\\": \\\"Define qu\\\\u00e9 conjuros puedes tener disponibles cada d\\\\u00eda y con qu\\\\u00e9 caracter\\\\u00edstica lo haces (Sabidur\\\\u00eda en tu caso).\\\", \\\"tactical_role\\\": \\\"Utilidad\\\"}, {\\\"id\\\": \\\"ability-mejora-de-caracteristica\\\", \\\"name\\\": \\\"Mejora de caracter\\\\u00edstica\\\", \\\"type\\\": \\\"class_feature\\\", \\\"lore_description\\\": \\\"Con la experiencia y el entrenamiento, tus capacidades naturales han ido mejorando poco a poco.\\\", \\\"tactical_summary\\\": \\\"En los niveles 4, 8, 12, 16 y 19 puedes subir una caracter\\\\u00edstica en 2 puntos, o dos caracter\\\\u00edsticas en 1 punto cada una (sin superar nunca 20).\\\", \\\"tactical_role\\\": \\\"Utilidad\\\"}, {\\\"id\\\": \\\"ability-conjuros-del-dominio-de-vida\\\", \\\"name\\\": \\\"Conjuros del dominio de vida\\\", \\\"type\\\": \\\"class_feature\\\", \\\"lore_description\\\": \\\"Tu diosa te concede autom\\\\u00e1ticamente ciertos conjuros ligados a la vida y la curaci\\\\u00f3n, que siempre tienes disponibles sin necesidad de elegirlos cada ma\\\\u00f1ana.\\\", \\\"tactical_summary\\\": \\\"Bendecir, Curar heridas, Restablecimiento menor, Arma espiritual, Faro de esperanza y Revivificar est\\\\u00e1n siempre preparados, sin ocupar hueco de los conjuros que elijas cada d\\\\u00eda.\\\", \\\"tactical_role\\\": \\\"Utilidad\\\"}, {\\\"id\\\": \\\"ability-canalizar-divinidad\\\", \\\"name\\\": \\\"Canalizar divinidad\\\", \\\"type\\\": \\\"class_feature\\\", \\\"lore_description\\\": \\\"Tu v\\\\u00ednculo con tu diosa te permite canalizar su poder dos veces entre descansos, ya sea para ahuyentar no-muertos o para curar de emergencia a tus aliados.\\\", \\\"tactical_summary\\\": \\\"Tienes 2 usos de Canalizar Divinidad que se recuperan al completar un descanso corto o largo; puedes elegir entre Expulsar muertos vivientes o Preservar la vida cada vez que lo uses.\\\", \\\"tactical_role\\\": \\\"Utilidad\\\"}]}, \\\"lore_info\\\": {\\\"backstory\\\": \\\"Miralia es una cl\\\\u00e9riga ciega que abandon\\\\u00f3 el templo para llevar la palabra de su diosa a quienes m\\\\u00e1s lo necesitan, guiada por una fe tan profunda que jam\\\\u00e1s permite que su ceguera la limite. Viaja junto a Doloria Pussydestroyer, la paladina que jur\\\\u00f3 protegerla desde que se conocieron durante su formaci\\\\u00f3n religiosa, y forma parte de las Dragonas Livianas, un grupo de aventureras tan famosas por sus desastres como por sus milagrosos rescates.\\\", \\\"personality_traits\\\": \\\"Nunca permito que mis limitaciones definan qui\\\\u00e9n soy. Siempre intento encontrar algo bueno incluso en las personas m\\\\u00e1s dif\\\\u00edciles.\\\", \\\"ideals\\\": \\\"Fe. Mi diosa gu\\\\u00eda mi camino, incluso cuando yo no puedo verlo.\\\", \\\"bonds\\\": \\\"\\\", \\\"flaws\\\": \\\"Conf\\\\u00edo demasiado en la bondad de los dem\\\\u00e1s.\\\"}}\"]");localStorage.setItem("flutter.easydnd.skin.dark.v1","false");location.href="/";</script>
