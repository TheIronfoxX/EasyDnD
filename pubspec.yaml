name: easydnd
description: >-
  HUD de combate offline para D&D 5e: roster de fichas, economía de
  acciones, dados, recursos e inventario, pensado para la mesa de juego.
publish_to: 'none'

# Rework v2: salto de versión mayor para marcar la reescritura completa.
version: 2.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Estado: Provider, troceado en stores chicos por feature (Etapa 2+).
  provider: ^6.1.2

  # Persistencia: SharedPreferences, encapsulado en el repositorio (Etapa 2).
  # Elegido a propósito por sobre SQLite: las fichas son JSONs chicos y la
  # migración desde las claves viejas es directa.
  shared_preferences: ^2.3.2

  # Tipografía de las skins (Etapa 6).
  google_fonts: ^6.2.1

  # Descarga de la ficha cruda de Nivel20 (wizard de importación, Etapa 3).
  http: ^1.2.2

  # Importar/exportar fichas como archivo JSON.
  file_picker: ^11.0.2

  # Foto del personaje (tab Lore).
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Regenerador de íconos del launcher (Etapa 7). Los íconos ya generados
  # viven commiteados en android/app/src/main/res; esto es solo la herramienta.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    # Ícono de la app (lo usaba la pantalla de bienvenida vieja y lo va a
    # seguir usando la nueva).
    - assets/icon/icon.png
    # El prompt del wizard de importación. PROVISORIO: en la Etapa 3 se
    # consolida como constante Dart y esta entrada (y el archivo) desaparecen.
    - assets/promt.txt

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon.png"
